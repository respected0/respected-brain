name: ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  RESPECTED_TEST_PYTHON: python

jobs:
  compatibility:
    # Windows only for now; macOS/Linux code stays in the repository but is not built or tested in CI.
    name: early compatibility (windows, Python 3.10)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install editable package
        run: python -m pip install -e ".[dev]"
      - name: Verify minimum-version import, wheel and host adapters
        run: python -m unittest tests.packaging.test_package_contract tests.core.test_platform tests.integrations.test_turn_log_pipeline tests.scenarios.test_provider_matrix -v

  native:
    name: native (windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 35
    needs: compatibility
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package and native build tools
        run: python -m pip install -e ".[dev]"
      - name: Build required native distribution
        run: python tools/build_dist.py --platform windows --output dist
      - name: Verify frozen launcher without system Python
        run: python tools/verify_distribution.py --platform windows --distribution dist/RespectedBrain
      - name: Physical host package smoke
        run: python tests/native/smoke/platform_smoke.py --package dist/RespectedBrain --output native-smoke.json
      - name: Preserve native executable permissions for source matrix
        run: python -c "import shutil; shutil.make_archive('native-payload','gztar',root_dir='dist')"
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native-payload.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: native-smoke.json
          if-no-files-found: warn

  source:
    name: source (windows, Python ${{ matrix.python }})
    needs: native
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable package
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: native-windows
      - name: Extract required Python-independent native payload
        shell: bash
        run: |
          mkdir -p dist
          tar -xzf native-payload.tar.gz -C dist
      - name: Run Python unit and integration tests
        run: python -m unittest discover -s tests -t .
      - name: Verify diff whitespace
        run: git diff --check
