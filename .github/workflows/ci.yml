name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  RESPECTED_TEST_PYTHON: python

jobs:
  native:
    name: native (windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install package and native build tools
        run: python -m pip install -e ".[dev]"
      - name: Build required native distribution
        run: python packaging/build_dist.py --platform windows --output dist
      - name: Verify frozen launcher without system Python
        run: python -m unittest tests.packaging.test_distribution -v
      - name: Physical host package smoke
        run: python tests/native/smoke/platform_smoke.py --package dist/RespectedBrain --output native-smoke.json
      - name: Preserve native executable permissions for source matrix
        run: python -c "import shutil; shutil.make_archive('native-payload','gztar',root_dir='dist')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows
          path: native-payload.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: smoke-windows
          path: native-smoke.json
          if-no-files-found: warn

  source:
    name: source (windows, Python 3.13)
    needs: native
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install editable package
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-windows
      - name: Extract required Python-independent native payload
        shell: bash
        run: |
          mkdir -p dist
          tar -xzf native-payload.tar.gz -C dist
      - name: Run Python unit and integration tests
        run: python -m unittest discover -s tests -t .
      - name: Verify diff whitespace
        run: git diff --check
