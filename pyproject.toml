[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "respected-brain"
version = "0.1.0-beta.2"
description = "Local, provider-neutral memory for a personal Markdown vault"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RESPECTED" }]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/respected0/respected-brain"

[project.optional-dependencies]
dev = ["setuptools>=77", "build>=1", "wheel", "pyinstaller>=6", "tomli>=2; python_version < '3.11'"]

[project.scripts]
respected-brain = "respected_brain.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"respected_brain.resources" = [
  "defaults.json",
  "instructions/default.md",
  "skills/ajan-gecmis-tara/SKILL.md",
  "skills/brain-doktor/SKILL.md",
  "skills/brain-meydan-oku/SKILL.md",
  "skills/brain-oruntu/SKILL.md",
  "skills/gecmis-import/SKILL.md",
  "skills/inbox-duzenle/SKILL.md",
  "skills/obsidian-layout/SKILL.md",
  "skills/otonom-arastirma/SKILL.md",
  "skills/yazilim-kalite/SKILL.md",
  "vault-template/.gitignore",
  "vault-template/.obsidian/snippets/brain-layout.css",
  "vault-template/.respected.json",
  "vault-template/daily/.gitkeep",
  "vault-template/knowledge/concepts/.gitkeep",
  "vault-template/knowledge/connections/.gitkeep",
  "vault-template/knowledge/index.md",
  "vault-template/knowledge/log.md",
  "vault-template/🎯 100-Command-Center/Briefings/.gitkeep",
  "vault-template/🎯 100-Command-Center/Dashboard.md",
  "vault-template/🎯 100-Command-Center/Skills-Map.md",
  "vault-template/🎯 100-Command-Center/Vault-Map.md",
  "vault-template/🏰 300-Projects/.gitkeep",
  "vault-template/📋 Templates/Base.base",
  "vault-template/📋 Templates/Canvas.canvas",
  "vault-template/📋 Templates/Note.md",
  "vault-template/📥 000-Inbox/Dump/.gitkeep",
  "vault-template/📦 900-Archive/.gitkeep",
  "vault-template/🔮 850-Companion/Core.md",
  "vault-template/🔮 850-Companion/events/.gitkeep",
  "vault-template/🔮 850-Companion/events/archive/.gitkeep",
  "vault-template/🔮 850-Companion/Journal.md",
  "vault-template/🔮 850-Companion/Kurallar.md",
